<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StudySync</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css">
  <link rel="stylesheet" href="js/libs/plugins/mdtoast.min.css">
  <link rel="stylesheet" href="css/style.css">

  <link rel="shortcut icon" type="image/ico" href="img/playstore.ico"/>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudySync">
  <link rel="apple-touch-icon" href="img/newicons/icon-192x192.png">
</head>
<body>

  <!-- ── PANTALLA DE SELECCIÓN DE PERFIL ── -->
  <div id="seleccion" class="seleccion-screen animated fadeIn fast">
    <div class="seleccion-card">
      <div class="seleccion-logo">Study<span>Sync</span></div>
      <p class="seleccion-sub">Tu cuaderno académico siempre contigo</p>

      <div class="seleccion-form">
        <input id="inputNombre" type="text" placeholder="Tu nombre" maxlength="30" autocomplete="off">
        <input id="inputCarrera" type="text" placeholder="Tu carrera" maxlength="50" autocomplete="off">
      </div>

      <div class="avatares-grid">
        <img data-avatar="avatar1" src="img/avatars/avatar1.png" alt="Avatar 1" class="avatar-opt">
        <img data-avatar="avatar2" src="img/avatars/avatar2.png" alt="Avatar 2" class="avatar-opt">
        <img data-avatar="avatar3" src="img/avatars/avatar3.png" alt="Avatar 3" class="avatar-opt">
        <img data-avatar="avatar4" src="img/avatars/avatar4.png" alt="Avatar 4" class="avatar-opt">
      </div>

      <button id="btnEntrar" class="btn-entrar" disabled>Entrar</button>
    </div>
  </div>

  <!-- ── APP PRINCIPAL ── -->
  <div id="app" class="app-container oculto">

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="navbar-brand">Study<span>Sync</span></div>
      <div class="navbar-right">
        <button id="btnDarkMode" class="nav-icon-btn" aria-label="Modo oscuro">
          <i class="fa fa-moon"></i>
        </button>
        <button id="btnSalir" class="profile-chip" aria-label="Salir">
          <div id="profileDot" class="profile-dot">?</div>
          <span id="profileNombre">—</span>
        </button>
      </div>
    </nav>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="search-section">
      <div class="search-wrap">
        <i class="fa fa-search search-icon"></i>
        <input id="inputBuscar" type="text" placeholder="Buscar apuntes, materias, tags…" autocomplete="off">
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filtros-row" id="filtrosRow">
      <button class="chip active" data-filter="todos">Todos</button>
      <button class="chip" data-filter="apunte">Apuntes</button>
      <button class="chip" data-filter="evento">Eventos</button>
      <!-- Las materias se insertan dinámicamente -->
    </div>

    <!-- TIMELINE DE APUNTES -->
    <ul id="timeline" class="timeline"></ul>
    <button id="btnExportar" class="fab-export" aria-label="Exportar PDF">
    <i class="fa fa-file-pdf"></i>
    </button>
    <!-- BOTÓN FLOTANTE NUEVO APUNTE -->
    <button id="btnNuevo" class="fab" aria-label="Nuevo apunte">
      <i class="fa fa-plus"></i>
    </button>

  </div>
  <!-- FIN APP PRINCIPAL -->

  <!-- ── MODAL NUEVO APUNTE ── -->
  <div id="modal" class="modal oculto">
    <div class="modal-inner">

      <div class="modal-header">
        <span class="modal-titulo">Nuevo apunte</span>
        <button id="btnCancelar" class="modal-close" aria-label="Cerrar">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <div class="modal-body">

        <!-- Tipo -->
        <div class="field-group">
          <label class="field-label">Tipo</label>
          <div class="tipo-toggle">
            <button class="tipo-btn active" data-tipo="apunte">
              <i class="fa fa-book-open"></i> Apunte
            </button>
            <button class="tipo-btn" data-tipo="evento">
              <i class="fa fa-calendar-alt"></i> Evento
            </button>
          </div>
        </div>

        <!-- Título -->
        <div class="field-group">
          <label class="field-label" for="inputTitulo">Título *</label>
          <input id="inputTitulo" type="text" placeholder="Ej: Parcial de Cálculo" maxlength="100">
        </div>

        <!-- Materia -->
        <div class="field-group">
          <label class="field-label" for="inputMateria">Materia *</label>
          <input id="inputMateria" type="text" placeholder="Ej: Cálculo III" maxlength="60"
                 list="materiasList">
          <datalist id="materiasList"></datalist>
        </div>

        <!-- Contenido -->
        <div class="field-group">
          <label class="field-label" for="txtContenido">Contenido</label>
          <textarea id="txtContenido" placeholder="Escribe tu apunte aquí…" rows="4"></textarea>
        </div>

        <!-- Tags -->
        <div class="field-group">
          <label class="field-label" for="inputTags">Tags</label>
          <input id="inputTags" type="text" placeholder="Ej: #parcial #quiz (separados por espacio)">
        </div>

        <!-- Fecha de entrega (solo evento) -->
        <div class="field-group" id="grupoFecha" style="display:none">
          <label class="field-label" for="inputFecha">Fecha de entrega</label>
          <input id="inputFecha" type="datetime-local">
        </div>

        <!-- Acciones de recursos nativos — Persona 2 conecta aquí -->
        <div class="recursos-row">
          <button id="btnUbicacion" class="recurso-btn" title="Adjuntar ubicación">
            <i class="fa fa-map-marker-alt"></i>
          </button>
          <button id="btnFoto" class="recurso-btn" title="Tomar foto">
            <i class="fa fa-camera"></i>
          </button>
          <button id="btnAudio" class="recurso-btn" title="Grabar audio">
            <i class="fa fa-microphone"></i>
          </button>
          <button id="btnGaleria" class="recurso-btn" title="Adjuntar de galería">
            <i class="fa fa-images"></i>
          </button>
        </div>

        <!-- Inputs nativos ocultos -->
        <input type="file" id="inputFotoCamara" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="inputFotoGaleria" accept="image/*" style="display:none">

        <!-- Preview de recursos adjuntos -->
        <div id="recursosPreview" class="recursos-preview"></div>

      </div>

      <div class="modal-footer">
        <button id="btnGuardar" class="btn-guardar">
          <i class="fa fa-paper-plane"></i> Guardar apunte
        </button>
      </div>

    </div>
  </div>
  <!-- FIN MODAL -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/libs/plugins/mdtoast.min.js"></script>
  <script src="js/camara-class.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
